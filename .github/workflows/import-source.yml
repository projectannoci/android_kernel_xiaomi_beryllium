name: Import kernel source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor == 'projectannoci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and import source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          meta = json.loads(pathlib.Path("source-import.json").read_text())
          if meta["device"] != "beryllium" or meta["tree"] != "88df52874ef3b39e100295db5fd964c57a828112" or meta["pack_sha256"] != "6d6a472b3492b1dc7071c1ca2c3b2f9082b7efa2c3fb9b306eba607686ff9933":
              raise SystemExit("Source does not match the approved snapshot")
          expected = [f"source.pack.part-{i:03d}" for i in range(len(meta["parts"]))]
          if not expected or meta["parts"] != expected:
              raise SystemExit("Invalid source part list")
          digest = hashlib.sha256()
          with open("/tmp/kernel-source.pack", "wb") as out:
              for name in expected:
                  with open(name, "rb") as part:
                      while chunk := part.read(1024 * 1024):
                          digest.update(chunk)
                          out.write(chunk)
          if digest.hexdigest() != meta["pack_sha256"]:
              raise SystemExit("Source pack integrity check failed")
          with open("/tmp/kernel-source.pack", "rb") as pack:
              subprocess.run(["git", "index-pack", "--stdin"], stdin=pack, stdout=subprocess.DEVNULL, check=True)
          tree = meta["tree"]
          if len(tree) != 40 or any(c not in "0123456789abcdef" for c in tree):
              raise SystemExit("Invalid source tree")
          if subprocess.check_output(["git", "cat-file", "-t", tree], text=True).strip() != "tree":
              raise SystemExit("Missing source tree")
          files = subprocess.check_output(["git", "ls-tree", "-r", "-z", tree]).split(b"\0")
          if len(files) - 1 != meta["files"]:
              raise SystemExit("Source file count mismatch")
          subprocess.run(["git", "config", "user.name", "ProjectNoci"], check=True)
          subprocess.run(["git", "config", "user.email", "352963465+projectannoci@users.noreply.github.com"], check=True)
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          commit = subprocess.check_output(["git", "commit-tree", tree, "-p", parent, "-m", "Import Singularity kernel source for " + meta["device"]], text=True).strip()
          subprocess.run(["git", "push", "origin", commit + ":refs/heads/main"], check=True)
          print("Published", meta["device"], "source:", meta["files"], "files")
          PY
